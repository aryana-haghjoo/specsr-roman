name: Publish to PyPI

# Dispatchable as well as release-triggered: the first upload has to happen
# before the README can honestly say `pip install specsr-roman`, and that
# README is what the tagged release archives.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    # Only the public repo is the published one; this file also ships to it
    # from the private repo, where a publish would be wrong.
    if: github.repository == 'aryana-haghjoo/specsr-roman'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/specsr-roman
    permissions:
      # Trusted publishing: PyPI verifies this workflow's OIDC identity, so no
      # API token is stored anywhere -- not in the repo, not on a laptop.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
